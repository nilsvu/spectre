Executable: SolvePunctures
Testing:
  Check: parse;execute_check_output
  Timeout: 40
  Priority: High
ExpectedOutput:
  - PuncturesReductions.h5
  - PuncturesVolume0.h5
OutputFileChecks:
  - Label: Volume integrals
    Subfile: VolumeIntegrals.dat
    FileGlob: PuncturesReductions.h5
    ExpectedData:
      - [0, 448, 4.18881285829836e+03, 4.55724627651079e-02]
      - [1, 448, 4.18881285829836e+03, 4.19621052692138e-02]
      - [2, 1262, 4.18883545625731e+03, 5.07147168589194e-02]
    AbsoluteTolerance: 1e-8
  - Label: Nonlinear solver convergence
    Subfile: NewtonRaphsonResiduals.dat
    FileGlob: PuncturesReductions.h5
    SkipColumns: [1] # Skip walltime
    ExpectedData:
      # AMR iteration 0
      - [0, 0, 7.32123992463425e-02, 1.]
      - [1, 0, 3.51364804783180e-04, 1.]
      - [2, 0, 6.28169780068392e-09, 1.]
      # AMR iteration 1
      - [0, 0, 1.10970183155322e-01, 1.]
      - [1, 0, 3.36432810360753e-05, 1.]
      - [2, 0, 1.05116741194963e-09, 1.]
    AbsoluteTolerance: 1e-6

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Background:
  MultiplePunctures:
    Punctures:
      # Offset from center so the puncture doesn't coincide with a grid point
      - Position: [0., 0., 0.]
        Mass: 4.0
        Momentum: [0., 0., 0.]
        Spin: [0., 0., 0.75]
      - Position: [10., 0., 0.]
        Mass: 1.0
        Momentum: [0., 0.31623, 0.]
        Spin: [0., 0., 0.62]
      - Position: [12., 9., 0.]
        Mass: 1.1
        Momentum: [-0.15492, 0.20656, 0.]
        Spin: [0., 0., 0.68]
      - Position: [-16.62983, -6.88830, 0.]
        Mass: 1.3
        Momentum: [0.090199, -0.21776, 0.]
        Spin: [0., 0., 0.76]
      - Position: [-13.43503, -13.43503, 0.]
        Mass: 1.25
        Momentum: [0.16222, -0.16222, 0.]
        Spin: [0., 0., 0.72]
      - Position: [-7.65367, -18.47759, 0.]
        Mass: 1.15
        Momentum: [0.20658, -0.085571, 0.]
        Spin: [0., 0., 0.78]

InitialGuess: Flatness

RandomizeInitialGuess: None

DomainCreator:
  Sphere:
    InnerRadius: 45.
    OuterRadius: &outer_radius 1e5
    Interior:
      FillWithSphericity: 0.
    InitialRefinement:
      InnerCube: [2, 2, 2]
      Shell0: [2, 2, 0]
      Shell1: [2, 2, 1]
    InitialGridPoints: 6
    RadialPartitioning: [&outer_shell_inner_radius 65.]
    RadialDistribution: [Linear, &outer_shell_distribution Inverse]
    UseEquiangularMap: False
    EquatorialCompression: None
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition: Flatness

Amr:
  Verbosity: Verbose
  Criteria:
    # h-refine (split) elements at the punctures, and p-refine everywhere else
    - RefineAtPunctures
    - IncreaseResolution
    # - TruncationError:
    #     VariablesToMonitor: [Field]
    #     AbsoluteTarget: 1.e-8
    #     RelativeTarget: 1.e-8
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: False
    Isotropy: Anisotropic
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: True
    AllowCoarsening: True
  MaxCoarseLevels: Auto
  Iterations: 12

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: Gauss
    Formulation: StrongInertial

Observers:
  VolumeFileName: "PuncturesVolume"
  ReductionFileName: "PuncturesReductions"

NonlinearSolver:
  NewtonRaphson:
    ConvergenceCriteria:
      MaxIterations: 20
      RelativeResidual: 0.
      AbsoluteResidual: 1.e-8
    SufficientDecrease: 1.e-4
    MaxGlobalizationSteps: 40
    DampingFactor: 1.
    Verbosity: Quiet

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 30
      RelativeResidual: 1.e-4
      AbsoluteResidual: 1.e-12
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: Auto
    PreSmoothing: True
    UseBottomSolver: False
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: False

  SchwarzSmoother:
    Iterations: 3
    MaxOverlap: 2
    Verbosity: Silent
    SubdomainSolver:
      Gmres:
        ConvergenceCriteria:
          MaxIterations: 3
          RelativeResidual: 1.e-4
          AbsoluteResidual: 1.e-12
        Verbosity: Silent
        Restart: None
        Preconditioner:
          MinusLaplacian:
            Solver:
              ExplicitInverse:
                WriteMatrixToFile: None
            BoundaryConditions: Auto
    SkipResets: True
    ObservePerCoreReductions: False
    OutputVolumeData: False

RadiallyCompressedCoordinates:
  InnerRadius: *outer_shell_inner_radius
  OuterRadius: *outer_radius
  Compression: *outer_shell_distribution

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - Field
            - Alpha
            - RadiallyCompressedCoordinates
            - ConformalFactorMinusOne
            - TracelessConformalExtrinsicCurvature
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
      - ObserveNorms:
          SubfileName: VolumeIntegrals
          TensorsToObserve:
            - Name: AdmMassIntegrand
              NormType: VolumeIntegral
              Components: Individual

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Verbose
  EnableDirectSolve: True
  SkipResets: True
