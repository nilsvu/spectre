name: Deploy static executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: false
        description: >-
          The name of the release tag to upload to. Leave empty to only upload
          the assets as workflow artifacts, e.g. for testing.

jobs:
  deploy_static_execs:
    name: Deploy static executables and libraries (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # We build native images on matching runners (amd64 on ubuntu-latest, arm64
    # on the GitHub-hosted ARM64 runner) rather than cross-compiling with QEMU,
    # which proved fragile. See BuildDockerContainer.yaml for details.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            asset: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset: arm64
    env:
      RELEASE_TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Build static executables in a manylinux container so they are
      # compatible with most Linux distros (see Dockerfile.buildenv).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build static executables
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: "./containers/Dockerfile.buildenv"
          target: deploy_static_execs_and_libs
          tags: sxs-collaboration/spectre:deploy_static_execs_and_libs
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            PARALLEL_MAKE_ARG=-j4
      - name: Run Docker container
        run: >
          docker run --name static-execs
          sxs-collaboration/spectre:deploy_static_execs_and_libs
      - name: Install python dependencies
        run: >
          pip3 install numpy h5py gdown
      # The files in Google Drive carry a date suffix in their names so that
      # the data used by older releases stays available when we regenerate
      # them. Pass '-O' so the local names don't depend on the Drive names:
      # the steps below and CheckCceOutput.py expect these exact names.
      # CheckCceOutput.py itself lives in the repo, not in Google Drive.
      - name: Download extra data to include for CCE
        run: |
          gdown \
          "https://drive.google.com/uc?id=1CmgLLfuLod8stc13EtmjHUvBoIgSVD-Y" \
          -O BondiSachsCceR0200.h5
          gdown \
          "https://drive.google.com/uc?id=1vlftw2DKfywZdOXCLWpGfnyysrLAV130" \
          -O CharacteristicExtractReduction_Expected.h5
      - name: Copy CCE executables from the container
        run: >
          mkdir CceExecutables;
          mkdir ./CceExecutables/PreprocessCceWorldtube;
          mkdir ./CceExecutables/Tests;

          cp ./tests/InputFiles/Cce/CharacteristicExtract.yaml
          ./CceExecutables/CharacteristicExtract.yaml

          cp ./tests/InputFiles/Cce/CheckCceOutput.py
          ./CceExecutables/Tests/CheckCceOutput.py

          cp
          ./tests/InputFiles/PreprocessCceWorldtube/PreprocessCceWorldtube.yaml
          ./CceExecutables/PreprocessCceWorldtube/PreprocessCceWorldtube.yaml

          cp
          ./tests/InputFiles/PreprocessCceWorldtube/AdmFirstOrderDriverPreprocessCceWorldtube.yaml
          ./CceExecutables/PreprocessCceWorldtube/AdmFirstOrderDriverPreprocessCceWorldtube.yaml

          cp
          ./tests/InputFiles/PreprocessCceWorldtube/AdmSecondOrderDriverPreprocessCceWorldtube.yaml
          ./CceExecutables/PreprocessCceWorldtube/AdmSecondOrderDriverPreprocessCceWorldtube.yaml

          docker cp
          static-execs:/sxscollaboration/spectre/build/bin/CharacteristicExtract
          ./CceExecutables/

          docker cp static-execs:/sxscollaboration/spectre/build/bin/PreprocessCceWorldtube
          ./CceExecutables/PreprocessCceWorldtube/

          docker cp
          static-execs:/sxscollaboration/spectre/build/bin/WriteCceWorldtubeCoordsToFile
          ./CceExecutables/PreprocessCceWorldtube/
      - name: Test CCE executable outside of container
        run: |
          mv BondiSachsCceR0200.h5 ./CceExecutables/Tests/
          mv CharacteristicExtractReduction_Expected.h5 \
          ./CceExecutables/Tests/

          sed -i 's/CceR0257/Tests\/BondiSachsCceR0200/g' \
          ./CceExecutables/CharacteristicExtract.yaml

          cd ./CceExecutables/

          ./CharacteristicExtract \
          --input-file ./CharacteristicExtract.yaml
          python ./Tests/CheckCceOutput.py
          rm CharacteristicExtractReduction.h5

          cd ../
      - name: Copy exporter library from the container
        run: |
          mkdir -p SpectreExporter/lib
          docker cp \
          static-execs:/sxscollaboration/spectre/build/lib/libBundledExporter.so \
          ./SpectreExporter/lib/
          docker cp static-execs:/sxscollaboration/spectre/build/include \
          ./SpectreExporter/
          cp -r ./tests/Unit/IO/Exporter/BundledExporter ./SpectreExporter/Tests
          cp ./tests/Unit/Visualization/Python/VolTestData0.h5 \
          ./SpectreExporter/Tests/
      # The runner has no SpECTRE dependencies installed, so this also checks
      # that the library is self-contained
      - name: Test exporter library outside of container
        run: |
          ldd ./SpectreExporter/lib/libBundledExporter.so
          cmake -S ./SpectreExporter/Tests -B build-test-exporter \
          -D SPECTRE_ROOT=$GITHUB_WORKSPACE/SpectreExporter
          cmake --build build-test-exporter
          for EXPORTER_TEST in TestSpectreExporter TestSpectreExporterC; do
            ./build-test-exporter/$EXPORTER_TEST \
            ./SpectreExporter/Tests/VolTestData0.h5 \
            element_data 0 Psi 0 0 0 -0.07059806932542323
          done
      - name: Create CCE executables release asset
        # Note: We use xz compression since it's much better than gzip, even
        # though it's a decent bit slower. Specifically, xz is two thirds the
        # size of gzip.
        run:  |
          tar cJf CceExecutables-${{ matrix.asset }}.tar.xz CceExecutables
      - name: Create exporter library release asset
        run: |
          tar cJf SpectreExporter-${{ matrix.asset }}.tar.xz SpectreExporter
      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.asset }}
          if-no-files-found: error
          path: |
            CceExecutables-${{ matrix.asset }}.tar.xz
            SpectreExporter-${{ matrix.asset }}.tar.xz
      - name: Upload to release
        if: env.RELEASE_TAG_NAME != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          fail_on_unmatched_files: true
          files: |
            CceExecutables-${{ matrix.asset }}.tar.xz
            SpectreExporter-${{ matrix.asset }}.tar.xz

  deploy_python_wheels:
    name: Deploy Python wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            asset: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset: arm64
    env:
      RELEASE_TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Python wheels
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: "./containers/Dockerfile.buildenv"
          target: deploy_python_wheels
          tags: sxs-collaboration/spectre:deploy_python_wheels
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            PARALLEL_MAKE_ARG=-j4
      - name: Copy Python wheels from the container
        run: |
          docker run --name python-wheels \
          sxs-collaboration/spectre:deploy_python_wheels
          docker cp \
          python-wheels:/sxscollaboration/spectre/build/wheelhouse ./
      # The runner has no SpECTRE dependencies installed, so this also checks
      # that the wheel is self-contained
      - name: Test Python wheel outside of container
        run: |
          python3 -m venv venv && . venv/bin/activate
          PY_TAG=$(python -c \
          'import sys; print(f"cp{sys.version_info[0]}{sys.version_info[1]}")')
          pip install ./wheelhouse/spectre-*-${PY_TAG}-*.whl
          spectre interpolate-to-points \
          ./tests/Unit/Visualization/Python/VolTestData0.h5 \
          -d element_data --step 0 -y Psi -p 0,0,0 | tee result.txt
          grep -- -0.0705980 result.txt
      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.asset }}
          if-no-files-found: error
          path: wheelhouse/*.whl
      - name: Upload to release
        if: env.RELEASE_TAG_NAME != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          fail_on_unmatched_files: true
          files: wheelhouse/*.whl

  # Build Python wheels for macOS (Apple silicon) like the Linux wheels in the
  # `deploy_python_wheels` stage of `containers/Dockerfile.buildenv`, but with
  # `delocate` instead of `auditwheel` to bundle the dependencies. Homebrew's
  # libraries target the runner's macOS version, so the wheels need at least
  # that version. We target the same version explicitly, because the compilers
  # otherwise target the patch version of the runner (clang) or even a later
  # version (gfortran). We also strip local symbols (`-Wl,-x`) to reduce the
  # size of the wheels, like `auditwheel repair --strip` on Linux.
  deploy_python_wheels_macos:
    name: Deploy Python wheels (macOS arm64)
    runs-on: macos-15
    env:
      PYTHON_VERSIONS: "3.10 3.11 3.12 3.13 3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Install Homebrew dependencies
        run: |
          brew install boost gsl hdf5 yaml-cpp
      # See the `unit_tests_macos` job in `Tests.yaml`
      - name: Install Charm++
        run: |
          git clone --branch v8.0.0 --depth 1 \
            https://github.com/UIUC-PPL/charm
          cd charm
          CHARM_CONFIG="multicore-darwin-arm8"
          ./build charm++ $CHARM_CONFIG \
            --with-production -j --build-shared --disable-tls \
            -DCMK_NO_ISO_MALLOC=1
          echo "CHARM_ROOT=$PWD/$CHARM_CONFIG" >> $GITHUB_ENV
      # When switching Python versions we only reconfigure, so only the Python
      # modules get rebuilt.
      - name: Build Python wheels
        run: |
          mkdir build && cd build
          MACOS_VERSION=$(sw_vers -productVersion | cut -d. -f1).0
          for PY_VERSION in ${PYTHON_VERSIONS}; do
            PY_TAG=cp${PY_VERSION/./}
            python${PY_VERSION} -m venv venv-${PY_TAG}
            PYTHON=$PWD/venv-${PY_TAG}/bin/python
            ${PYTHON} -m pip install pybind11 wheel delocate
            cmake \
              -U "*Python*" -U "*pybind11*" -U "PYBIND11*" \
              -D CMAKE_C_COMPILER=clang \
              -D CMAKE_CXX_COMPILER=clang++ \
              -D CMAKE_Fortran_COMPILER=gfortran-14 \
              -D CMAKE_BUILD_TYPE=Release \
              -D DEBUG_SYMBOLS=OFF \
              -D BUILD_TESTING=OFF \
              -D BOOTSTRAP_PY_DEPS=OFF \
              -D BOOTSTRAP_PY_DEV_DEPS=OFF \
              -D MEMORY_ALLOCATOR=SYSTEM \
              -D ENABLE_PARAVIEW=OFF \
              -D ENABLE_OPENMP=OFF \
              -D SPECTRE_FETCH_MISSING_DEPS=ON \
              -D USE_GIT_HOOKS=OFF \
              -D BUILD_DOCS=OFF \
              -D USE_CCACHE=OFF \
              -D OVERRIDE_ARCH=armv8.4-a \
              -D CHARM_ROOT=${CHARM_ROOT} \
              -D BLA_VENDOR=Apple \
              -D BUILD_SHARED_LIBS=ON \
              -D BUILD_PYTHON_BINDINGS=ON \
              -D Python_EXECUTABLE=${PYTHON} \
              -D CMAKE_OSX_SYSROOT=macosx \
              -D CMAKE_OSX_DEPLOYMENT_TARGET=${MACOS_VERSION} \
              -D CMAKE_SHARED_LINKER_FLAGS=-Wl,-x \
              -D CMAKE_MODULE_LINKER_FLAGS=-Wl,-x \
              ..
            make -j$(sysctl -n hw.ncpu) cli
            ${PYTHON} -m pip wheel --no-deps -w dist bin/python
            ${PYTHON} -m wheel tags --remove --python-tag ${PY_TAG} \
              --abi-tag ${PY_TAG} \
              --platform-tag macosx_${MACOS_VERSION/./_}_arm64 dist/*.whl
            venv-${PY_TAG}/bin/delocate-wheel -w wheelhouse dist/*.whl
            rm -r dist
          done
      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-macos-arm64
          if-no-files-found: error
          path: build/wheelhouse/*.whl

  # Test the macOS wheels on runners without SpECTRE's dependencies
  test_python_wheels_macos:
    name: Test Python wheels (${{ matrix.os }})
    needs: deploy_python_wheels_macos
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels-macos-arm64
          path: wheelhouse
      - name: Test Python wheel
        run: |
          python3 -m venv venv && . venv/bin/activate
          pip install ./wheelhouse/spectre-*-cp312-*.whl
          spectre interpolate-to-points \
          ./tests/Unit/Visualization/Python/VolTestData0.h5 \
          -d element_data --step 0 -y Psi -p 0,0,0 | tee result.txt
          grep -- -0.0705980 result.txt

  upload_python_wheels_macos:
    name: Upload Python wheels (macOS arm64)
    needs: test_python_wheels_macos
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
    if: inputs.tag_name || github.event.release.tag_name
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels-macos-arm64
          path: wheelhouse
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          fail_on_unmatched_files: true
          files: wheelhouse/*.whl
