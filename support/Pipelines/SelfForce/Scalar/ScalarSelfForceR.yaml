Description: >
  Solve for the scalar self-force on a particle in a circular equatorial
  orbit around a Kerr black hole.

  Example:
    spectre run ScalarSelfForce.yaml -o "test" \
      -p spin=0.0 -p orbital_radius=10 -p m_mode=2 -p inner_radius=1.9 \
      -p outer_radius=10000 -p puncture_position=15 -p worldtube_radius=15 \
      -p worldtube_dcostheta=0.5 -p P=4 -p L=2 -p L_theta=1

  Then, for example, run 'spectre generate-id' on the volume data output to view
  in ParaView or inspect the reduction data output to see the extracted
  self-force at the particle.
Executable: SolveScalarSelfForce
Testing:
  Check: parse
ExpectedOutput:
  - ScalarSelfForceReductions.h5
  - ScalarSelfForceVolume0.h5

---

Background: &background
  CircularOrbit:
    BlackHoleMass: &bh_mass 1.
    BlackHoleSpin: &bh_spin 0.5
    OrbitalRadius: &orbital_radius 10
    MModeNumber: &m_mode_number 2
    HyperboloidalSlicingTransitions: 
      - &v_to_t_transition 5  
      - &worldtube_left 6.5 
      - &worldtube_right 13.5
      - &t_to_u_transition 65 
    HyperboloidalSlicingTransitions_vtu: 
     - *v_to_t_transition
     - *t_to_u_transition 
    ImposeEquatorialSymmetry: False
    PenetratingHorizon: True

InitialGuess: *background

RandomizeInitialGuess: None

DomainCreator:
  AlignedLattice:
    # Order of dimensions is (r, theta)
    BlockBounds:
      - - &inner_radius 1.8660254037844385966 
        - *v_to_t_transition 
        - *worldtube_left 
        - *worldtube_right  
        - *t_to_u_transition 
        - 1e4
      # cos(theta)
      - [-1., -0.5 , 0.5, 1.]
    Distributions:
      # rstar
      - [Linear, Linear, Linear, Linear, Inverse]
      # cos(theta)
      - [Linear, Linear, Linear]
    SingularityPositions:
      # rstar
      - [0., 0., 0., 0., 0.]
      # cos(theta)
      - [0., 0., 0.]
    InitialGridPoints: [4, 4] # [{{ P }}, {{ P }}]
    InitialLevels: [2, 1] # [{{ L }}, {{ L_theta }}]
    RefinedGridPoints: []
    BlocksToExclude: []
    RefinedLevels:
      # bottom row
      - LowerCornerIndex: [0, 0] # bottom left
        UpperCornerIndex: [1, 1]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [1, 0] # bottom transition left
        UpperCornerIndex: [2, 1]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [2, 0] # bottom middle
        UpperCornerIndex: [3, 1]
        Refinement: [ 2, 1 ]
      - LowerCornerIndex: [3, 0] # bottom transition right
        UpperCornerIndex: [4, 1]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [4, 0] # bottom right
        UpperCornerIndex: [5, 1]
        Refinement: [ 2, 0 ]
      # middle row
      - LowerCornerIndex: [0, 1] # middle left
        UpperCornerIndex: [1, 2]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [1, 1] # middle transition left
        UpperCornerIndex: [2, 2]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [2, 1] # source region
        UpperCornerIndex: [3, 2]
        Refinement: [ 2, 1 ]
      - LowerCornerIndex: [3, 1] # middle transition right
        UpperCornerIndex: [4, 2]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [4, 1] # middle right
        UpperCornerIndex: [5, 2]
        Refinement: [ 2, 0 ]
      # top row
      - LowerCornerIndex: [0, 2] # top left
        UpperCornerIndex: [1, 3]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [1, 2] # top transition left
        UpperCornerIndex: [2, 3]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [2, 2] # top middle
        UpperCornerIndex: [3, 3]
        Refinement: [ 2, 1 ]
      - LowerCornerIndex: [3, 2] # top transition right
        UpperCornerIndex: [4, 3]
        Refinement: [ 1, 1 ]
      - LowerCornerIndex: [4, 2] # top right
        UpperCornerIndex: [5, 3]
        Refinement: [ 2, 0 ]
    BoundaryConditions: &boundary_conditions
      # Radial boundary conditions
      - Lower: None  # No radial boundary condition at the horizon
        Upper:
          Sommerfeld:
            BlackHoleMass: *bh_mass
            BlackHoleSpin: *bh_spin
            OrbitalRadius: *orbital_radius
            MModeNumber: *m_mode_number
            HyperboloidalSlicing: True
            PenetratingHorizon: True
            Order: 2
      # Angular boundary conditions
      - Angular:
          MModeNumber: *m_mode_number

Amr:
  Verbosity: Quiet
  Criteria:
    - IncreaseResolution
    - RefineAtPuncture
    # - TruncationError: # --> changed 
    #     VariablesToMonitor: [MMode]
    #     AbsoluteTarget: 1.e-10
    #     RelativeTarget: 1.e-10. # increase resolutions 
    # - Persson:
    #     VariablesToMonitor: [MMode]
    #     NumHighestModes: 1
    #     Exponent: 4.
    #     AbsoluteTolerance: 0.
    #     CoarseningFactor: 0.1
  Policies:
    Isotropy: Anisotropic
    EnforceTwoToOneBalanceInNormalDirection: True
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: True
    AllowCoarsening: True 
  MaxCoarseLevels: Auto
  Iterations: 10 

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: Gauss
    Formulation: StrongInertial

Observers:
  VolumeFileName: "ScalarSelfForceVolume"
  ReductionFileName: "ScalarSelfForceReductions"

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 500
      RelativeResidual: 0
      AbsoluteResidual: 1.e-10
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: 0
    PreSmoothing: True
    UseBottomSolver: True
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: False
    ComplexShift: 0.

  SchwarzSmoother:
    Iterations: 2
    MaxOverlap: Auto
    Verbosity: Silent
    SubdomainSolver:
      ExplicitInverse:
        WriteMatrixToFile: None
        ComplexShift: 0.01
    ObservePerCoreReductions: False
    OutputVolumeData: False
    # SubdomainBoundaryConditions: None
    #   - &subdomain_boundary_conditions
    #     - Sommerfeld:
    #         BlackHoleMass: *bh_mass
    #         BlackHoleSpin: *bh_spin
    #         OrbitalRadius: *orbital_radius
    #         MModeNumber: *m_mode_number
    #         HyperboloidalSlicing: True  # or false?
    #     - Angular:
    #         MModeNumber: *m_mode_number
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
            - Name: MMode
              NormType: Max
              Components: Individual
      - ObserveSelfForce
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - MMode
            - FixedSource(MMode)
            - Alpha
            - Beta
            - Gamma
            - SingularField
            - BoyerLindquistRadius
            - BoostFunction
            - BoostFunctionDeriv
          BlocksToObserve: All
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Silent
  EnableDirectSolve: True

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
