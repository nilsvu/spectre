Description: >
  Solve for the scalar self-force on a particle in a circular equatorial
  orbit around a Kerr black hole.

  Example:
    spectre run ScalarSelfForce.yaml -o "test" \
      -p spin=0.5 -p orbital_radius=6 -p m_mode=2 -p inner_radius=-50 \
      -p outer_radius=350 -p puncture_position=7.5 -p worldtube_radius=7.5 \
      -p worldtube_dcostheta=0.5 -p P=10 -p L=1

  Then, for example, run 'spectre generate-id' on the volume data output to view
  in ParaView or inspect the reduction data output to see the extracted
  self-force at the particle.
Executable: SolveScalarSelfForce
Testing:
  Check: parse
ExpectedOutput:
  - ScalarSelfForceReductions.h5
  - ScalarSelfForceVolume0.h5

---

Background: &background
  CircularOrbit:
    BlackHoleMass: &bh_mass 1.
    BlackHoleSpin: &bh_spin {{ spin }}
    OrbitalRadius: &orbital_radius {{ orbital_radius }}
    MModeNumber: &m_mode_number {{ m_mode }}
    HyperboloidalSlicingTransitions:
      - -25.
      - {{ puncture_position - worldtube_radius }}
      - {{ puncture_position + worldtube_radius }}
      - 40.

InitialGuess: *background

RandomizeInitialGuess: None

DomainCreator:
  AlignedLattice:
    # Order of dimensions is (r_*, theta)
    BlockBounds:
      # rstar
      - - {{ inner_radius }}
        - {{ puncture_position - worldtube_radius }}
        - {{ puncture_position + worldtube_radius }}
        - {{ outer_radius }}
      # cos(theta)
      - [-1., {{ -worldtube_dcostheta}} , {{ worldtube_dcostheta }}, 1.]
    InitialGridPoints: [{{ P }}, {{ P }}]
    InitialLevels: [{{ L }}, 0]
    RefinedGridPoints: []
    BlocksToExclude: []
    RefinedLevels:
      # bottom row
      - LowerCornerIndex: [0, 0] # bottom left
        UpperCornerIndex: [1, 1]
        Refinement: [ {{ L }}, 0 ]
      - LowerCornerIndex: [1, 0] # bottom middle
        UpperCornerIndex: [2, 1]
        Refinement: [ {{L - 1}}, 0 ]
      - LowerCornerIndex: [2, 0] # bottom right
        UpperCornerIndex: [3, 1]
        Refinement: [ {{ L + 1 }}, 0 ]
      # middle row
      - LowerCornerIndex: [0, 1] # middle left
        UpperCornerIndex: [1, 2]
        Refinement: [ {{ L }}, 0 ]
      - LowerCornerIndex: [1, 1] # source region
        UpperCornerIndex: [2, 2]
        Refinement: [ {{L - 1}}, 0 ]
      - LowerCornerIndex: [2, 1] # middle right
        UpperCornerIndex: [3, 2]
        Refinement: [ {{ L + 1 }}, 0 ]
      # top row
      - LowerCornerIndex: [0, 2] # top left
        UpperCornerIndex: [1, 3]
        Refinement: [ {{ L }}, 0 ]
      - LowerCornerIndex: [1, 2] # top middle
        UpperCornerIndex: [2, 3]
        Refinement: [ {{L - 1}}, 0 ]
      - LowerCornerIndex: [2, 2] # top right
        UpperCornerIndex: [3, 3]
        Refinement: [ {{ L + 1 }}, 0 ]
    BoundaryConditions: &boundary_conditions
      # Radial boundary conditions
      - Sommerfeld:
          BlackHoleMass: *bh_mass
          BlackHoleSpin: *bh_spin
          OrbitalRadius: *orbital_radius
          MModeNumber: *m_mode_number
          HyperboloidalSlicing: True
      # Angular boundary conditions
      - Angular:
          MModeNumber: *m_mode_number

Amr:
  Verbosity: Quiet
  Criteria:
    # - IncreaseResolution
    # - RefineAtPuncture
    # - RefineAtBoundaryY
    - TruncationError:
        VariablesToMonitor: [MMode]
        AbsoluteTarget: 1.e-8
        RelativeTarget: 1.e-8
    - Persson:
        VariablesToMonitor: [MMode]
        NumHighestModes: 1
        Exponent: 4.
        AbsoluteTolerance: 0.
        CoarseningFactor: 0.1
  Policies:
    Isotropy: Anisotropic
    EnforceTwoToOneBalanceInNormalDirection: False
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: True
    AllowCoarsening: False
  MaxCoarseLevels: Auto
  Iterations: 2

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: Gauss
    Formulation: StrongInertial

Observers:
  VolumeFileName: "ScalarSelfForceVolume"
  ReductionFileName: "ScalarSelfForceReductions"

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 100
      RelativeResidual: 0
      AbsoluteResidual: 1.e-6
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: 0
    PreSmoothing: True
    UseBottomSolver: True
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: False
    ComplexShift: 0.

  SchwarzSmoother:
    Iterations: 2
    MaxOverlap: Auto
    Verbosity: Quiet
    SubdomainSolver:
      ExplicitInverse:
        WriteMatrixToFile: None
        ComplexShift: 0.01
    ObservePerCoreReductions: False
    OutputVolumeData: False
    # SubdomainBoundaryConditions: None
    #   - &subdomain_boundary_conditions
    #     - Sommerfeld:
    #         BlackHoleMass: *bh_mass
    #         BlackHoleSpin: *bh_spin
    #         OrbitalRadius: *orbital_radius
    #         MModeNumber: *m_mode_number
    #         HyperboloidalSlicing: True  # or false?
    #     - Angular:
    #         MModeNumber: *m_mode_number
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions
    #   - *subdomain_boundary_conditions

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
            - Name: MMode
              NormType: Max
              Components: Individual
      - ObserveSelfForce
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - MMode
            - FixedSource(MMode)
            - Alpha
            - Beta
            - Gamma
            - SingularField
            - BoyerLindquistRadius
          BlocksToObserve: All
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Verbose
  EnableDirectSolve: True

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
